<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dimplex Virtual Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app. A header band with the team chips sits over a full-bleed 3D hallway; the person card and view controls float on the stage. */
:root{
  --bg:#eef1f4;
  --surface:#ffffff;
  --ink:#151a20;
  --muted:#5b6672;
  --line:#d6dce3;
  --accent:#e31837;
  --on-accent:#ffffff;
  --shadow:0 12px 32px rgba(21,26,32,.16);
  /* scene overlays sit on the lit 3D office in both themes */
  --scene-bg:#e7ebee;
  --tag-bg:rgba(255,255,255,.94);
  --tag-ink:#151a20;
  --tag-muted:#5b6672;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1317; --surface:#181d23; --ink:#eef2f5; --muted:#9aa5b1; --line:#2a3139;
    --accent:#f0364f; --shadow:0 12px 32px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1317; --surface:#181d23; --ink:#eef2f5; --muted:#9aa5b1; --line:#2a3139;
  --accent:#f0364f; --shadow:0 12px 32px rgba(0,0,0,.45); color-scheme:dark;
}
[hidden],#fallback[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column;overflow:hidden}

header{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;
  padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:var(--surface);border-bottom:1px solid var(--line);
  position:relative;z-index:3;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{flex:none;width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 18px/1 var(--f-display);font-style:italic}
h1{margin:0;font:800 clamp(18px,2.2vw,22px)/1.1 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin:3px 0 0;font-size:12px;color:var(--muted);letter-spacing:.02em}
.chips{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px/1 var(--f-body);cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--muted)}
.chip .d{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--scene-bg)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage.dragging canvas{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;border:0;margin:0;
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:5px 9px 6px;border-radius:9px;background:var(--tag-bg);color:var(--tag-ink);
  font:inherit;text-align:left;white-space:nowrap;box-shadow:0 4px 14px rgba(15,20,25,.16);
  will-change:transform;transition:opacity .2s}
.tag::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;background:var(--tag-bg);transform:rotate(45deg);border-radius:2px}
.tag .n{display:flex;align-items:center;gap:6px;font:700 13px/1.1 var(--f-body)}
.tag .n i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag .st{font-size:11px;line-height:1.2;color:var(--tag-muted)}
.bubble{position:absolute;left:50%;bottom:calc(100% + 10px);width:max-content;max-width:190px;padding:7px 10px;border-radius:12px;
  background:var(--tag-bg);color:var(--tag-ink);font:500 12px/1.3 var(--f-body);white-space:normal;text-align:center;
  box-shadow:0 6px 18px rgba(15,20,25,.18);opacity:0;transform:translate(-50%,6px) scale(.92);transform-origin:50% 100%;
  transition:opacity .25s,transform .25s;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;background:var(--tag-bg);transform:rotate(45deg);border-radius:2px}
.bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
.tag.on{box-shadow:0 0 0 2px var(--accent),0 6px 18px rgba(15,20,25,.22)}

.ctrl{position:absolute;top:12px;right:max(16px, env(safe-area-inset-right, 0px));display:flex;gap:8px;z-index:2}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px/1 var(--f-body);cursor:pointer;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--muted)}
.btn svg{width:15px;height:15px}

.hint{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:14px;margin:0;padding:7px 11px;border-radius:8px;background:rgba(21,26,32,.62);color:#fff;font-size:12px;pointer-events:none;z-index:1}

.card{position:absolute;left:max(16px, env(safe-area-inset-left, 0px));bottom:16px;width:min(330px, calc(100% - 32px));
  background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:14px 16px 15px;display:flex;flex-direction:column;gap:10px;z-index:2;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.card-top{display:flex;align-items:center;gap:12px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font:800 17px/1 var(--f-display);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.card h2{margin:0;font:800 19px/1.1 var(--f-display);letter-spacing:-.01em}
.role{margin:3px 0 0;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.x{margin-left:auto;align-self:flex-start;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer}
.status{margin:0;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.pulse{flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:ring 1.8s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(227,24,55,.5)}70%{box-shadow:0 0 0 8px rgba(227,24,55,0)}100%{box-shadow:0 0 0 0 rgba(227,24,55,0)}}
.traits{margin:0;display:grid;gap:8px}
.traits div{display:grid;gap:2px}
.traits dt{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.traits dd{margin:0;font-size:13.5px;line-height:1.45;max-width:65ch}

#fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#3b434c;font-size:14px}

@media (max-width:640px){
  header{gap:10px}
  .chips{margin-left:0;width:100%}
  .tag .st{display:none}
  .tag.on .st{display:block}
  .tag{padding:4px 8px 5px}
  .tag .n{font-size:12px}
  .bubble{max-width:150px;font-size:11px}
  .card{right:max(16px, env(safe-area-inset-right, 0px));width:auto;bottom:12px}
  .card ~ .hint{display:none}
  .btn span{display:none}
  .btn{padding:9px}
}
@media (prefers-reduced-motion: reduce){
  .card,.pulse{animation:none}
  .chip,.tag,.bubble{transition:none}
}
/* rebuild: compact labels, status only on hover or focus */
.tag{padding:3px 8px 4px;border-radius:8px;gap:1px}
.tag .n{font-size:12px}
.tag .st{display:none}
.tag:hover .st,.tag.on .st{display:block}
.tag.off{opacity:0;pointer-events:none}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 60%,rgba(20,26,34,.16) 100%);z-index:0}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;color:#3b434c;background:rgba(231,235,238,.55);z-index:4}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid #b9c1c9;border-top-color:#e31837;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{max-height:calc(100% - 28px);overflow-y:auto;overscroll-behavior:contain;width:min(360px, calc(100% - 32px))}
.mood{margin:0;font-size:13.5px;font-weight:600}
.ask{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.ask-h{margin:0;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.log{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow-y:auto;padding-right:2px}
.msg{max-width:85%;padding:7px 10px;border-radius:12px;font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--surface);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.typing{display:flex;gap:4px;padding:10px 12px}
.msg.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.msg.typing i:nth-child(2){animation-delay:.15s}.msg.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.q{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 10px;font:500 12px/1.2 var(--f-body);cursor:pointer;text-align:left}
.q:hover{border-color:var(--muted)}
.ask-f{display:flex;gap:6px}
.ask-f input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font:14px var(--f-body)}
.ask-f input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.send{border:0;border-radius:10px;padding:8px 14px;background:var(--accent);color:var(--on-accent);font:700 13px var(--f-body);cursor:pointer}
@media (max-width:640px){ .card{max-height:62%} .log{max-height:130px} }
@media (prefers-reduced-motion: reduce){ .spin,.msg.typing i{animation:none} }

@media (max-width:640px){ .card ~ .hint{display:block} .card:not([hidden]) ~ .hint{display:none} }

/* portrait tile: a video-call style close-up of whoever you are chatting with */
.ptile{position:absolute;top:62px;right:max(16px, env(safe-area-inset-right, 0px));width:232px;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);box-shadow:var(--shadow);z-index:3;display:flex;flex-direction:column;pointer-events:none;animation:pop .25s ease-out}
.pview{position:relative;height:280px;background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.pview[data-away="1"]{background:#1b1f25}
.pview[data-away="1"]::after{content:attr(data-msg);position:absolute;inset:0;display:grid;place-items:center;color:#c9d0d8;font-weight:600;font-size:13px}
.live{position:absolute;top:8px;left:8px;padding:2px 7px;border-radius:6px;background:rgba(227,24,55,.92);color:#fff;font:700 10px/1.4 var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.pcap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);color:var(--ink);font-size:12.5px}
.pcap b{font:700 13.5px/1.2 var(--f-body)}
.pcap span{color:var(--muted);white-space:nowrap}
@media (max-width:640px){
  .ptile{top:auto;bottom:12px;width:148px;border-radius:12px}
  .pview{height:170px}
  .pcap{flex-direction:column;align-items:flex-start;gap:1px;padding:6px 9px}
  .pcap span{font-size:11px}
}
@media (prefers-reduced-motion: reduce){ .ptile{animation:none} }

#labels{z-index:1}

/* desktop: the header becomes a compact left sidebar so the 3D view gets the full height */
.collapse{display:none}
@media (min-width:641px){
  body{flex-direction:row}
  header{flex-direction:column;align-items:stretch;flex-wrap:nowrap;width:212px;flex:none;gap:14px;
    padding-block:16px;border-bottom:0;border-right:1px solid var(--line);overflow:hidden}
  .brand{gap:10px}
  .mark{width:30px;height:30px;font-size:16px}
  h1{font-size:16px}
  .sub{font-size:11px}
  .chips{flex-direction:column;margin-left:0;overflow-x:hidden;overflow-y:auto;flex:1;min-height:0;gap:5px}
  .chip{width:100%;justify-content:flex-start;padding:8px 10px;border-radius:10px}
  .chip .lbl{overflow:hidden;text-overflow:ellipsis}
  .collapse{display:grid;place-items:center;align-self:flex-start;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
  .collapse svg{width:16px;height:16px;transition:transform .2s}
  body.mini header{width:64px;padding-left:12px;padding-right:12px}
  body.mini .brand > div:not(.mark), body.mini .chip .lbl{display:none}
  body.mini .chip{justify-content:center;padding:9px 0}
  body.mini .chip .d{width:14px;height:14px}
  body.mini .collapse{align-self:center}
  body.mini .collapse svg{transform:rotate(180deg)}
  .ptile{top:62px}
}
.pview[data-away="1"] .live{display:none}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>

</head>
<body>
<header>
  <div class="brand">
    <div class="mark" aria-hidden="true">D</div>
    <div>
      <h1><em>Dimplex</em> Virtual Office</h1>
      <p class="sub">Marketing team floor, Glen Dimplex Americas</p>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="Team"></nav>
  <button class="collapse" id="collapse" type="button" aria-label="Collapse sidebar" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
</header>

<main id="stage">
  <div id="labels"></div>
  <div class="ctrl">
    <button class="btn" id="reset" type="button" aria-label="Reset view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      <span>Reset view</span>
    </button>
  </div>
  <section class="card" id="card" hidden aria-live="polite">
    <div class="card-top">
      <div class="avatar" id="cAvatar"></div>
      <div>
        <h2 id="cName"></h2>
        <p class="role" id="cRole"></p>
      </div>
      <button class="x" id="cClose" type="button" aria-label="Close card">&times;</button>
    </div>
    <p class="status"><span class="pulse"></span><span id="cStatus"></span></p>
    <p class="mood" id="cMood"></p>
    <dl class="traits">
      <div><dt>Personality</dt><dd id="cPers"></dd></div>
    </dl>
    <div class="ask">
      <p class="ask-h" id="askH">Ask</p>
      <div class="log" id="log" hidden></div>
      <div class="sugg" id="sugg"></div>
      <form class="ask-f" id="askForm" autocomplete="off">
        <input id="askIn" type="text" maxlength="160" placeholder="Ask something" aria-label="Your question">
        <button type="submit" class="send">Ask</button>
      </form>
    </div>
  </section>
  <p class="hint" id="hint">Drag to rotate. Tap anyone to chat with them.</p>
  <div class="ptile" id="ptile" hidden><div class="pview" id="pview" data-away="0"><span class="live">Live</span></div><div class="pcap"><b id="pName"></b><span id="pMood"></span></div></div>
  <div class="vignette" aria-hidden="true"></div>
  <div id="loading"><span class="spin"></span>Loading the team…</div>
  <div id="fallback" hidden>The 3D office needs WebGL. Try a recent version of Chrome, Edge, Safari or Firefox.</div>
</main>

  if ((m === 10 && d >= 15) || (m === 11 && d <= 1)) return "halloween";

  return "none";
})();

function costumeBody(p, model, body){

function seasonTick(t, dt){
  if (!SZ) return;
  for (var i = 0; i < seasonFx.bulbMats.length; i++) {
    var bm = seasonFx.bulbMats[i], tw = 0.7 + 0.3 * Math.sin(t * 2.2 + i * 2.1);
    bm.color.copy(bm.userData.base).multiplyScalar(tw);
  }
  if (seasonFx.faceMat) { var fl = 0.82 + 0.18 * noise(t * 8); seasonFx.faceMat.color.setRGB(fl, 0.72 * fl, 0.38 * fl); }
  for (i = 0; i < seasonFx.bats.length; i++) {
    var b = seasonFx.bats[i], a = t * b.sp + b.ph;
    b.g.position.set(Math.sin(a) * b.rx, b.y + 0.12 * Math.sin(a * 2.3), b.cz + Math.cos(a) * b.rz);
    b.g.rotation.y = Math.atan2(Math.cos(a) * b.rx, -Math.sin(a) * b.rz);
    var fp = Math.sin(t * 15 + b.ph * 3) * 0.75;
    b.wl.rotation.z = fp; b.wr.rotation.z = -fp;
  }
  for (i = 0; i < seasonFx.mist.length; i++) {
    var ms = seasonFx.mist[i];
    ms.m.position.x = ms.x + 0.35 * Math.sin(t * 0.11 + ms.ph);
    ms.m.position.z = ms.z + 0.25 * Math.sin(t * 0.07 + ms.ph * 2);
  }
  var L = seasonFx.line;
  if (L) {
    if (t > L.t1 && !L.replied && L.b) { L.replied = true; if (L.a.bubble.textContent === L.text) showBubble(L.a, null); showBubble(L.b, L.reply); L.t2 = t + 2.6; }
    if (t > L.t2) { if (L.b && L.b.bubble.textContent === L.reply) showBubble(L.b, null); if (!L.b && L.a.bubble.textContent === L.text) showBubble(L.a, null); seasonFx.line = null; }
    return;
  }
  if (!seasonFx.next) seasonFx.next = t + rand(8, 18);
  if (t < seasonFx.next) return;
  seasonFx.next = t + rand(35, 75);
  var who = PEOPLE.filter(function(q){ return q.state === "sit" && q.root.visible && !q.chatWith && !q.bubbleOn && !q.answering && q.onScreen; });
  if (!who.length || chats.some(function(c){ return c.bubbles; })) return;
  var a0 = choose(who), near = who.filter(function(q){ return q !== a0 && Math.abs(q.z - a0.z) < 2.2; });
  var b0 = near.length && Math.random() < 0.75 ? choose(near) : null;
  var text = choose(SZ.says);
  showBubble(a0, text);
  seasonFx.line = { a:a0, b:b0, text:text, reply:choose(SZ.replies), t1:t + 2.6, t2:t + 2.8, replied:false };
}

function rollMood(p){
  var w = PROFILE[p.id].moodW, tot = 0, k;
  for (k in w) tot += w[k];
  var r = Math.random() * tot;
  for (k in w) { r -= w[k]; if (r <= 0) break; }
  p.mood = { kind:k, base:k, v:MOODS[k].v };
  p.moodWhy = k === "excited" ? (p.id === "stephanie" ? "a new fireplace is about to launch" : "something good is coming this week")
    : k === "stressed" ? "deadlines everywhere" : k === "tired" ? "it has been a long week of deadlines" : k === "off" ? "it is one of those slow, heavy work days" : "";
}
function recomputeMood(p){
  var m = p.mood, v = m.v, prof = PROFILE[p.id];
  if (m.base === "off" && v < 0.3) { m.kind = "off"; return; }
  if (v > 0.7) m.kind = m.base === "excited" ? "excited" : "great";
  else if (v > 0.4) m.kind = "great";
  else if (v > 0.15) m.kind = "good";
  else if (v > -0.15) m.kind = "okay";
  else m.kind = p.needs.energy < 0.35 || prof.traits.stressTol > 0.6 ? "tired" : "stressed";
}
function moodShift(p, dv, why){
  p.mood.v = clamp(p.mood.v + dv, -1, 1);
  if (why) p.moodWhy = why;
  recomputeMood(p);
}

function lev(a, b){
  if (Math.abs(a.length - b.length) > 1) return 9;
  var m = a.length, n = b.length, prev = [], cur = [], i, j;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++) {
    cur = [i];
    for (j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}

  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 1) dragDist = 0;
  if (pointers.size === 2) { pinch0 = pdist(); r0 = goal.r; dragDist += 100; }
  dragging = true; stage.classList.add("dragging");
  lastInteract = performance.now() / 1000;
});
canvas.addEventListener("pointermove", function(e){
  var pt = pointers.get(e.pointerId);
  if (!pt) return;
  var dx = e.clientX - pt.x, dy = e.clientY - pt.y;
  pt.x = e.clientX; pt.y = e.clientY;
  if (pointers.size === 1) {
    goal.th -= dx * 0.0065;
    goal.ph = clamp(goal.ph - dy * 0.004, 0.5, 1.3);
    dragDist += Math.abs(dx) + Math.abs(dy);
  } else if (pointers.size === 2) {
    goal.r = clamp(r0 * pinch0 / pdist(), 1.8, 34);
  }
  lastInteract = performance.now() / 1000;
});
function endPointer(e){
  if (!pointers.has(e.pointerId)) return;
  var wasSingle = pointers.size === 1;
  pointers.delete(e.pointerId);
  if (e.type === "pointerup" && wasSingle && dragDist < 7) pick(e);
  if (pointers.size === 0) { dragging = false; stage.classList.remove("dragging"); }
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("wheel", function(e){
  e.preventDefault();
  goal.r = clamp(goal.r * Math.exp(e.deltaY * 0.0012), 1.8, 34);
  lastInteract = performance.now() / 1000;
}, { passive:false });

var ray = new T.Raycaster(), ndc = new T.Vector2();
function pick(e){
  var rect = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  var hits = ray.intersectObjects(pickables, false);
  for (var i = 0; i < hits.length; i++) {
    var p = BY[hits[i].object.userData.pid];
    if (p && p.root.visible) { focusOn(p); return; }
  }
}



/* ---------- load the people ---------- */
try {
  GLTF = await new GLTFLoader().loadAsync(MODEL_URL);
} catch (e) { fail("Could not load the 3D people. Check your connection and reload the page."); return; }
GLTF.animations.forEach(function(c){ CLIPS[c.name] = c; });
T.AnimationUtils.makeClipAdditive(CLIPS.agree);
PEOPLE.forEach(function(p){ makeRig(p); });
/* ---------- remote colleagues: each one lives in a small scene rendered to a wall screen ---------- */
function homeTex(seed, wall, accent){
  return canvasTex(512, 320, function(g, w, h){
    var r = seeded(seed), i;
    g.fillStyle = wall; g.fillRect(0, 0, w, h);
    g.fillStyle = "rgba(0,0,0,0.06)"; g.fillRect(0, h * 0.82, w, h * 0.18);
    var sky = g.createLinearGradient(0, 30, 0, 170);
    sky.addColorStop(0, "#9cc7ea"); sky.addColorStop(1, "#e3eff7");
    g.fillStyle = "#f4f2ee"; g.fillRect(28, 26, 150, 150);
    g.fillStyle = sky; g.fillRect(36, 34, 134, 134);
    g.fillStyle = "#f4f2ee"; g.fillRect(100, 34, 6, 134); g.fillRect(36, 98, 134, 6);
    g.fillStyle = "#6f5640"; g.fillRect(330, 40, 150, 10); g.fillRect(330, 110, 150, 10); g.fillRect(330, 180, 150, 10);
    for (var shelf = 0; shelf < 3; shelf++) {
      var x = 336;
      while (x < 470) {
        var bw = 8 + r() * 12, bh = 34 + r() * 22;
        g.fillStyle = ["#c44d3a","#3c6e9c","#d9b45a","#5b8c5a","#8a6aa8","#e0dcd2"][Math.floor(r() * 6)];
        g.fillRect(x, 40 + shelf * 70 - bh, bw, bh);
        x += bw + 2;
      }
    }
    g.fillStyle = accent; g.fillRect(220, 50, 70, 90);
    g.fillStyle = "rgba(255,255,255,0.5)"; g.fillRect(228, 58, 54, 74);
    g.fillStyle = "#e8e2d8"; g.fillRect(205, 215, 46, 70);
    for (i = 0; i < 7; i++) { g.fillStyle = i % 2 ? "#3f7d4a" : "#5a9e63"; g.beginPath(); g.ellipse(228 + Math.cos(i) * 18, 200 - i * 6, 14, 30, i * 0.5, 0, 7); g.fill(); }
  });
}
function captionTex(p){
  return canvasTex(512, 64, function(g, w, h){
    g.fillStyle = "rgba(10,12,15,0.62)"; rrect(g, 8, 8, w - 16, h - 16, 12); g.fill();
    g.fillStyle = "#35d07f"; g.beginPath(); g.arc(34, h / 2, 8, 0, 7); g.fill();
    g.fillStyle = "#ffffff"; g.font = "600 24px " + FONT; g.textBaseline = "middle"; g.textAlign = "left";
    g.fillText("Online", 52, h / 2 + 1);
    g.textAlign = "right"; g.font = "700 26px " + FONT;
    g.fillText(p.fullName || p.name, w - 26, h / 2 + 1);
  });
}
REMOTE.forEach(function(p, i){
  var rs = new T.Scene();
  rs.background = new T.Color(i ? "#e9e1d6" : "#dfe6ea");
  rs.environment = scene.environment;
  rs.add(new T.HemisphereLight(0xffffff, 0xb8a58c, 0.7));
  var dl = new T.DirectionalLight(0xfff1e0, 0.9); dl.position.set(1.5, 3, 3); rs.add(dl);
  var back = new T.Mesh(new T.PlaneGeometry(4.4, 2.75), new T.MeshStandardMaterial({ map:homeTex(31 + i * 17, i ? "#e9e1d6" : "#dfe6ea", i ? "#c96f4a" : "#4a7fc9"), roughness:0.9 }));
  back.position.set(0, 1.3, -1.25); rs.add(back);
  add(G.box, M(i ? "#b9936b" : "#d8d2c8", { roughness:0.55 }), 1.5, 0.045, 0.62, 0, 0.74, 0.6, rs, false);
  makeRig(p, rs);
  p.cat = buildCat(rs);
  var cam = new T.PerspectiveCamera(30, 16 / 9, 0.1, 20);
  cam.position.set(0, 1.3, 1.7); cam.lookAt(0, 1.1, 0);
  var rt = new T.WebGLRenderTarget(384, 216, { samples:2 });
  p.rs = rs; p.rcam = cam; p.rt = rt;

  var g = new T.Group(); g.position.set(p.sx, 1.8, -4.0); g.scale.setScalar(0.72); scene.add(g);
  add(G.box, M("#121418", { roughness:0.35, metalness:0.4 }), 2.0, 1.16, 0.07, 0, 0, 0, g);
  var glowM = new T.MeshBasicMaterial({ color:0x8fc0ff, transparent:true, opacity:0.32, blending:T.AdditiveBlending, depthWrite:false });
  var glow = new T.Mesh(G.plane, glowM); glow.scale.set(2.2, 1.36, 1); glow.position.z = -0.03; g.add(glow);
  p.offTex = canvasTex(384, 216, function(gc, w, h){
    gc.fillStyle = "#1b1f25"; gc.fillRect(0, 0, w, h);
    gc.fillStyle = p.shirt; gc.beginPath(); gc.arc(w / 2, h / 2 - 14, 42, 0, 7); gc.fill();
    gc.fillStyle = "#ffffff"; gc.font = "700 34px " + FONT; gc.textAlign = "center"; gc.textBaseline = "middle";
    gc.fillText((p.fullName || p.name).split(" ").map(function(s){ return s.charAt(0); }).join("").slice(0, 2), w / 2, h / 2 - 12);
    gc.fillStyle = "#aab3bd"; gc.font = "600 20px " + FONT; gc.fillText("Camera off", w / 2, h / 2 + 52);
  });
  p.camNext = rand(25, 90); p.camOff = false;
  var scr = new T.Mesh(G.plane, new T.MeshBasicMaterial({ map:rt.texture }));
  p.scrMat = scr.material; p.liveTex = rt.texture;
  scr.scale.set(1.9, 1.07, 1); scr.position.z = 0.037; scr.userData.pid = p.id; g.add(scr);
  pickables.push(scr);
  var capM = new T.Mesh(G.plane, new T.MeshBasicMaterial({ map:captionTex(p), transparent:true, depthWrite:false, toneMapped:false }));
  capM.scale.set(1.5, 0.1875, 1); capM.position.set(0, -0.43, 0.04); g.add(capM);
  var anchor = new T.Object3D(); anchor.position.set(0, 0.74, 0.05); g.add(anchor);
  p.head = anchor; p.screenG = g; p.glowM = glowM;
  p.spot = new V3(p.sx, 0, -3.15);
  p.seat = new V3(p.sx, 0, -4.1);
});
function updateRemote(p, t, dt){
  var r = p.rig;
  r.sit = 1; r.walkTarget = 0;
  p.mood.v += (MOODS[p.mood.base].v - p.mood.v) * dt * 0.003;
  if (t > p.typeNext) { p.typeOn = !p.typeOn; p.typeNext = t + (p.typeOn ? rand(2, 7) : rand(0.8, 3.5)); }
  if (p.act && t - p.act.t0 > p.act.dur + 0.5) p.act = null;
  if (p.answering && t > p.answering) p.answering = 0;
  if (p.chatWith && (!p.act || p.act.n !== "answer")) startAct(p, "answer", t, 4);
  if (!p.act && !p.chatWith && !p.answering && t > p.nextAct) { startAct(p, choose(["sip","phone","stretch","leanBack","sip"]), t); p.nextAct = t + rand(6, 16); }
  p.typeAmp = lerp(p.typeAmp, p.typeOn && !p.act ? 1 : 0, 1 - Math.exp(-dt * 4));
  p.glowM.opacity = 0.26 + (p.chatWith || p.answering ? 0.18 : 0) + 0.04 * Math.sin(t * 2 + p.sx);
  /* now and then the camera goes off for a while */
  if (t > p.camNext) {
    p.camOff = !p.camOff;
    p.camNext = t + (p.camOff ? rand(30, 120) : rand(60, 200));
    p.camOffSaid = false;
    p.scrMat.map = p.camOff ? p.offTex : p.liveTex;
  }
  p.statusNow = p.answering ? "Answering your question" : p.chatWith ? "On a video call with " + p.chatWith.name : p.camOff ? "Camera off, still online" : p.status;
  updateRig(p, t, dt);
}

scene.traverse(function(o){ if (o.material && o.material.isMeshStandardMaterial && o.material.envMapIntensity === 1) o.material.envMapIntensity = 0.5; });

/* ---------- post-processing: ground-contact ambient occlusion on larger screens ---------- */
try {
  if (window.__voAO) {
    var cpr = renderer.getPixelRatio();
    composer = new EffectComposer(renderer, new T.WebGLRenderTarget(Math.max(1, stage.clientWidth * cpr), Math.max(1, stage.clientHeight * cpr), { samples:4, type:T.HalfFloatType }));
    composer.addPass(new RenderPass(scene, camera));
    aoPass = new GTAOPass(scene, camera, stage.clientWidth, stage.clientHeight);
    aoPass.gtaoMaterial.defines.PERSPECTIVE_CAMERA = 0;
    aoPass.pdMaterial.defines.PERSPECTIVE_CAMERA = 0;
    aoPass.gtaoMaterial.needsUpdate = true; aoPass.pdMaterial.needsUpdate = true;
    aoPass.updateGtaoMaterial({ radius:0.35, distanceExponent:1.5, thickness:1, scale:1, samples:12 });
    aoPass.updatePdMaterial({ lumaPhi:10, depthPhi:2, normalPhi:3, radius:5, rings:2, samples:12 });
    aoPass.blendIntensity = 0.85;
    composer.addPass(aoPass);
    composer.addPass(new OutputPass());
    composer.setPixelRatio(renderer.getPixelRatio());
    composer.setSize(stage.clientWidth, stage.clientHeight);
  }
} catch (e) { composer = null; aoPass = null; }
loadingEl.hidden = true;
window.__voReady = true;
window.__vo = { people:BY, focus:function(id){ focusOn(BY[id]); }, ask:function(id, q){ ask(BY[id], q); }, converse:function(id, q){ return converse(BY[id], q).text; }, goal:goal, view:view, season:function(){ seasonFx.next = 1; return SEASON; }, mishap:function(k){ MISHAP.cur = null; return startMishap(k, clock.elapsedTime); }, mishaps:MISHAP };
var snapCam = 0;
/* a link like #p-luis opens that person's card on load */
function focusFromHash(){ var m = /^#p-([a-z]+)$/.exec(location.hash || ""); if (m && BY[m[1]]) { focusOn(BY[m[1]]); snapCam = 3; } }
window.addEventListener("hashchange", focusFromHash);
focusFromHash();


/* ---------- loop ---------- */
var clock = new T.Clock(), headPos = new V3(), tv = new V3();
var aoFailed = false, DT_MAX = 0.05;
var frameNo = 0, LBL = null;
var PERF = { t0:0, frames:0, done:false };
function degrade(){
  if (composer) { composer = null; return true; }
  if (sun.shadow.mapSize.x > 1024) { sun.shadow.mapSize.set(1024, 1024); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } return true; }
  return false;
}
var STATS = { calls:0, tris:0, ms:0, n:0, last:0, sec:{ agents:0, rigs:0, render:0, labels:0 } };
function mark(name, t0){ STATS.sec[name] += performance.now() - t0; }
window.__voStats = function(){ var n = Math.max(1, STATS.n), sec = {}; Object.keys(STATS.sec).forEach(function(k){ sec[k] = +(STATS.sec[k] / n).toFixed(2); }); return { drawCalls:STATS.calls, triangles:STATS.tris, frameMs:+(STATS.ms / n).toFixed(1), frames:STATS.n, msPerSection:sec, pixelRatio:renderer.getPixelRatio(), ao:!!composer, shadowMap:sun.shadow.mapSize.x, geometries:renderer.info.memory.geometries, textures:renderer.info.memory.textures }; };
renderer.info.autoReset = false;
function frame(){
  requestAnimationFrame(frame);
  if (document.hidden) return;
  var nowMs = performance.now();
  if (STATS.last) { STATS.ms += nowMs - STATS.last; STATS.n++; }
  STATS.last = nowMs;
  STATS.calls = renderer.info.render.calls; STATS.tris = renderer.info.render.triangles;
  renderer.info.reset();
  var dt = Math.min(clock.getDelta(), DT_MAX), t = clock.elapsedTime;
  frameNo++;
  if (!LBL) LBL = ALL.slice();
  /* adaptive quality: measure for 3 s, then drop AO, shadow resolution and pixel ratio until we hold about 45 fps */
  if (!PERF.done) {
    PERF.frames++;
    if (!PERF.t0) PERF.t0 = nowMs;
    else if (nowMs - PERF.t0 > 3000) {
      var fps = PERF.frames * 1000 / (nowMs - PERF.t0);
      if (fps >= 45 || !degrade()) PERF.done = true;
      PERF.t0 = nowMs; PERF.frames = 0;
    }
  }

  var m0 = performance.now();
  PEOPLE.forEach(function(p){ updateAgent(p, t, dt); });
  updateChats(t);
  mark("agents", m0); m0 = performance.now();
  /* people off screen animate at a third of the rate */
  PEOPLE.forEach(function(p){
    p.skipDt = (p.skipDt || 0) + dt;
    if (p.root.visible) { updateRig(p, t, p.skipDt); p.skipDt = 0; }
    else if (!p.root.visible && frameNo % 3 === 0) { p.rig.mixer.update(p.skipDt); p.skipDt = 0; }
  });
  REMOTE.forEach(function(p){ updateRemote(p, t, dt); });
  updateMishaps(t, dt);

  mark("rigs", m0);
  var busy = false;
  PEOPLE.forEach(function(p){ if (p.trip && p.trip.kind === "meeting") busy = true; });
  roomLampMat.color.setHex(busy ? 0xff2a3d : 0x29c46b);

  flames.forEach(function(f){
    var nn = noise(t * 7 + f.o);
    f.m.scale.y = f.s * (0.82 + 0.28 * nn);
    f.m.scale.x = (f.m.scale.z > 0.5 ? 1 : 0.55) * (0.92 + 0.1 * noise(t * 5 + f.o * 2));
  });
  fireLight.intensity = 0.8 + 0.3 * noise(t * 9);
  var glow = 1.05 + 0.25 * Math.sin(t * 1.4);
  heatStrips.forEach(function(m){ m.material.emissiveIntensity = glow; });
  heatLight.intensity = 0.7 + 0.15 * Math.sin(t * 1.4);
  seasonTick(t, dt);

  if (focus) {
    focus.head.getWorldPosition(headPos);
    if (!focus.root.visible) headPos.copy(focus.trip && focus.trip.kind === "coffee" ? COFFEE_SPOT : EXIT_SPOT).setX(focus.trip && focus.trip.kind === "coffee" ? -4.0 : 4.0).setY(1.6);
    goal.tx = headPos.x; goal.ty = headPos.y - 0.35; goal.tz = headPos.z;
  }
  var kk = snapCam > 0 ? 1 : 1 - Math.exp(-dt * (dragging ? 14 : reduceMotion ? 9 : 3.2));
  if (snapCam > 0) snapCam--;
  view.tx = lerp(view.tx, goal.tx, kk); view.ty = lerp(view.ty, goal.ty, kk); view.tz = lerp(view.tz, goal.tz, kk);
  view.r = lerp(view.r, goal.r, kk); view.th = lerp(view.th, goal.th, kk); view.ph = lerp(view.ph, goal.ph, kk);
  var idle = reduceMotion ? 0 : clamp(t - lastInteract - 4, 0, 3) / 3;
  if (lastInteract < 0) idle = reduceMotion ? 0 : 1;
  var th = view.th + idle * 0.04 * Math.sin(t * 0.17);
  var ph = view.ph + idle * 0.012 * Math.sin(t * 0.23);
  basis(th, ph);
  camera.position.set(view.tx + camDir.x * 70, view.ty + camDir.y * 70, view.tz + camDir.z * 70);
  camera.lookAt(view.tx, view.ty, view.tz);
  camera.left = -view.r * aspect; camera.right = view.r * aspect; camera.top = view.r; camera.bottom = -view.r;
  camera.updateProjectionMatrix();

  if (focus) {
    focusRing.visible = focus.root.visible && !focus.remote;
    var mk = MOODS[focus.mood.kind].e + " " + MOODS[focus.mood.kind].label;
    if (cMood.textContent !== mk) cMood.textContent = mk;
    focusRing.position.set(focus.root.position.x, 0.012, focus.root.position.z);
    ringMat.opacity = 0.6 + 0.3 * Math.sin(t * 4);
    if (cStatus.textContent !== focus.statusNow) cStatus.textContent = focus.statusNow;
  } else focusRing.visible = false;

  m0 = performance.now();
  /* remote screens: low resolution, one screen per frame */
  var rp = REMOTE[frameNo % REMOTE.length];
  if (!rp.camOff) { renderer.setRenderTarget(rp.rt); renderer.render(rp.rs, rp.rcam); }
  renderer.setRenderTarget(null);
  if (composer && !aoFailed) {
    try { composer.render(dt); } catch (e) { aoFailed = true; renderer.render(scene, camera); }
  } else renderer.render(scene, camera);
  if (focus && !ptile.hidden) {
    var small = window.innerWidth <= 640;
    ptile.style.bottom = small && !card.hidden ? (card.offsetHeight + 22) + "px" : "";
    var pm = MOODS[focus.mood.kind].e + " " + MOODS[focus.mood.kind].label;
    if (pMood.textContent !== pm) pMood.textContent = pm;
    renderPortrait();
  }

  mark("render", m0); m0 = performance.now();
  /* labels: name only, status on hover or focus; drop the ones that would overlap */
  var w = stage.clientWidth, h = stage.clientHeight, placed = [];
  /* the portrait tile is a see-through window onto the canvas: keep labels out of it */
  if (!ptile.hidden) {
    var tr0 = ptile.getBoundingClientRect(), sr0 = stage.getBoundingClientRect();
    placed.push({ l:tr0.left - sr0.left, r:tr0.right - sr0.left, t:tr0.top - sr0.top, b:tr0.bottom - sr0.top, tile:true });
  }
  var order = LBL.sort(function(a, b){ return (a === focus ? -1 : 0) - (b === focus ? -1 : 0) || (a.remote ? -9 : a.root.position.z) - (b.remote ? -9 : b.root.position.z); });
  order.forEach(function(p){
    var tag = p.tag;
    p.head.getWorldPosition(tv);
    if (!p.root.visible) tv.copy(EXIT_SPOT).setY(1.6);
    tv.y += p.remote ? 0 : 0.3;
    tv.project(camera);
    p.onScreen = !(tv.z > 1 || tv.x < -1.25 || tv.x > 1.25 || tv.y < -1.25 || tv.y > 1.25);
    if (!p.onScreen || (!p.root.visible && p !== focus)) { tag.classList.add("off"); showBubble(p, null); return; }
    var x = (tv.x + 1) / 2 * w, y = (1 - tv.y) / 2 * h;
    if (!p.tagW) { p.tagW = tag.offsetWidth || 70; p.tagH = tag.offsetHeight || 24; }
    var rect = { l:x - p.tagW / 2, r:x + p.tagW / 2, t:y - p.tagH - 6, b:y - 6 };
    var hit = placed.some(function(q){ return rect.l < q.r + 4 && rect.r > q.l - 4 && rect.t < q.b + 2 && rect.b > q.t - 2; });
    var hitTile = placed.length && placed[0].tile && rect.l < placed[0].r && rect.r > placed[0].l && rect.t < placed[0].b && rect.b > placed[0].t;
    if ((hit && p !== focus && !p.bubbleOn) || hitTile) { tag.classList.add("off"); return; }
    placed.push(rect);
    tag.classList.remove("off");
    tag.style.transform = "translate(" + Math.round(x) + "px," + Math.round(y) + "px) translate(-50%,-100%) translateY(-6px)";
    tag.style.zIndex = p === focus ? 2000 : String(Math.round((1 - tv.z) * 900));
    if (p.tagText !== p.statusNow) { p.tagText = p.statusNow; p.tagSt.textContent = p.statusNow; }
  });
  mark("labels", m0);
}
requestAnimationFrame(frame);
})();
